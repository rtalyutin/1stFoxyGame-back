<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Последний трон — загрузка</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090f14;color:#e2edee;font:17px system-ui}main{max-width:32rem;padding:2rem}h1{font:36px Georgia}button{background:#9be8cc;color:#091a15;border:0;padding:12px 18px;border-radius:6px;font:inherit}p{line-height:1.6}</style>
<main><h1>Последний трон</h1><p id="status" role="status">Открываем актуальную версию…</p><button id="retry" hidden>Повторить загрузку</button></main>
<script>
const statusText=document.getElementById('status'),retry=document.getElementById('retry');
async function launch(){retry.hidden=true;const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);try{const response=await fetch('/td/current.json',{cache:'no-store',signal:controller.signal});if(!response.ok)throw Error('no release');const m=await response.json();if(!/^[a-zA-Z0-9][a-zA-Z0-9._-]{0,79}$/.test(m.releaseId)||m.clientEntry!=='web/index.html')throw Error('invalid release');const base='/td/releases/'+encodeURIComponent(m.releaseId)+'/';const manifestResponse=await fetch(base+'manifest.json',{signal:controller.signal});if(!manifestResponse.ok)throw Error('release unavailable');const manifest=await manifestResponse.json();if(manifest.releaseId!==m.releaseId||manifest.clientEntry!==m.clientEntry)throw Error('identity mismatch');const page=await fetch(base+m.clientEntry,{method:'HEAD',signal:controller.signal});if(!page.ok)throw Error('client unavailable');location.replace(base+m.clientEntry);}catch{statusText.textContent='Версия пока недоступна. Попробуйте снова через несколько секунд.';retry.hidden=false;}finally{clearTimeout(timer);}}
retry.addEventListener('click',launch);launch();
</script></html>
